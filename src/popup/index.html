<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOMA Recommender</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="app">
      <header class="header">
        <p class="eyebrow">SOMA Recommender</p>
        <h1>개인 맞춤 특강 추천</h1>
      </header>

      <section class="panel" aria-live="polite">
        <p class="label">현재 페이지</p>
        <p id="page-title" class="value">페이지 정보를 불러오는 중...</p>
      </section>

      <button id="recommend-button" type="button">추천 받기</button>

      <section id="result" class="result" hidden></section>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
